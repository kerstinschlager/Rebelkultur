name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No JavaScript files found.'
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

  frontend-integrity:
    name: Frontend integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required frontend files and references
        shell: bash
        run: bash scripts/check-frontend-integrity.sh

  supabase-security:
    name: Supabase SECURITY DEFINER safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SECURITY DEFINER functions
        shell: bash
        run: bash scripts/check-supabase-security.sh
