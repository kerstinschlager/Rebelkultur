server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|json|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
}
